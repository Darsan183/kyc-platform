# Development configuration with H2 embedded database
spring:
  datasource:
    url: jdbc:h2:mem:kycplatform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

app:
  security:
    jwt:
      secret: dev-jwt-secret-key-for-local-development-minimum-256-bits
      issuer: kyc-platform-dev
      expiration-time: 3600000
  document:
    storage:
      root: ${java.io.tmpdir}/kyc-documents

logging:
  level:
    com.kyc.platform: DEBUG
    org.hibernate.SQL: DEBUG

# Enable H2 console for debugging
spring.h2.console:
  enabled: true
  path: /h2-console