spring:
  application:
    name: kyc-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/kycplatform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production}
      issuer: kyc-platform
      expiration-time: 3600000
      refresh-token-expiration: 86400000
  document:
    storage:
      root: ${DOCUMENT_STORAGE_PATH:./documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com:
      kyc:
        platform: INFO
    org:
      springframework:
        security: INFO
  pattern:
    level: "%5p [${traceId:-}]"