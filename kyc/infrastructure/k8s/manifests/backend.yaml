apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-backend
  namespace: kyc-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kyc-backend
  template:
    metadata:
      labels:
        app: kyc-backend
    spec:
      containers:
        - name: backend
          image: kyc-platform/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-backend
  namespace: kyc-platform
spec:
  selector:
    app: kyc-backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP