groups:
  - name: kyc-alerts
    rules:
      - alert: HighRiskCases
        expr: kyc_risk_score > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High risk case detected"
          description: "Customer {{ $labels.customer_id }} has risk score {{ $value }}"

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "API latency above 2 seconds"

      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database unavailable"
          description: "PostgreSQL database is not responding"