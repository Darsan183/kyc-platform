{{- range $index, $count := .Values.backend.replicaCount }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kyc-platform.fullname" . }}-backend
  labels:
    {{- include "kyc-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ $count }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kyc-platform.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kyc-platform.name" . }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}/backend:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "kyc-platform.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}