replicaCount:
  backend: 3
  frontend: 2
  agents: 2

image:
  repository: ghcr.io/kyc-platform
  pullPolicy: IfNotPresent
  tag: latest

backend:
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

frontend:
  port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

agents:
  port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

postgresql:
  auth:
    database: kycplatform
    username: kycuser
    password: kycpass

neo4j:
  auth:
    password: kycpass