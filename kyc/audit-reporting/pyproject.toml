[tool.poetry]
name = "kyc-audit-reporting"
version = "1.0.0"
description = "Audit Reporting Module for KYC Compliance"
authors = ["KYC Team <team@kycplatform.com>"]
readme = "README.md"
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
reportlab = "^4.1.0"
jinja2 = "^3.1.0"
weasyprint = "^61.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
pydantic = "^2.6.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"