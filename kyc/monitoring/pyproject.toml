[tool.poetry]
name = "kyc-monitoring"
version = "1.0.0"
description = "Continuous Monitoring Module for KYC"
authors = ["KYC Team <team@kycplatform.com>"]
readme = "README.md"
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
asyncpg = "^0.29.0"
apscheduler = "^3.0.0"
redis = "^5.0.0"
pydantic = "^2.6.0"
httpx = "^0.27.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"